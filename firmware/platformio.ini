; PlatformIO config for the Seeed XIAO ESP32S3 Sense (8 MB flash, 8 MB OPI PSRAM, OV2640 camera)

[env:xiao_esp32s3_sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-esp32-s3-sense
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; OPI PSRAM must be enabled, or the camera frame buffer and the tensor arena won't fit
board_build.arduino.memory_type = qio_opi
; Larger app partition: TFLite Micro + the 399 KB model can exceed the default
board_build.partitions = default_8MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    ; Needed on XIAO ESP32S3 for Serial output over USB. If the serial monitor
    ; stays blank, check this flag first.
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    tanakamasayuki/TensorFlowLite_ESP32